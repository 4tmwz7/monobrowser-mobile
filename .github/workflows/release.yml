name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and check the tag
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^monobrowser\.version=//p' gradle.properties | tr -d '[:space:]')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z, got $GITHUB_REF_NAME" >&2; exit 1
          fi
          if [[ "$declared" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match monobrowser.version=$declared in gradle.properties" >&2; exit 1
          fi
          if [[ ! -f ".github/release-notes/$GITHUB_REF_NAME.md" ]]; then
            echo "Missing .github/release-notes/$GITHUB_REF_NAME.md" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing GitHub secret for $name (see AGENTS.md, section Wydanie)" >&2; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MONO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
      - name: Install SDK / NDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/adblock
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build signed release APK
        env:
          MONO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Verify the APK (version, signature) and write the checksum
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          cd app/build/outputs/apk/release
          apk="MonoBrowser-$VERSION.apk"
          test -f "$apk"
          name="$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.* versionName='\([^']*\)'.*/\1 \2/p")"
          if [[ "$name" != "com.voluene.monobrowser $VERSION" ]]; then
            echo "APK reports '$name', expected 'com.voluene.monobrowser $VERSION'" >&2; exit 1
          fi
          "$build_tools/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Publish GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dir=app/build/outputs/apk/release
          gh release create "$GITHUB_REF_NAME" \
            "$dir/MonoBrowser-$VERSION.apk" "$dir/MonoBrowser-$VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "MonoBrowser Mobile $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
