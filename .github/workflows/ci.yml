name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle toolchain wants JDK 17 (kept in JAVA_HOME_17_X64); Gradle itself runs on 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK / NDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/adblock
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust tests (host)
        run: cargo test --manifest-path native/adblock/Cargo.toml

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
